<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--META--><title>The Wedding of Raka & Salsa</title><meta property="og:title" content="The Wedding of Raka & Salsa"><meta property="og:description" content="Dengan memohon rahmat Allah SWT, kami mengundang Anda ke pernikahan kami pada 2027-03-14."><meta property="og:image" content="https://akun.github.io/nikah-demo/foto/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:type" content="website"><meta property="og:url" content="https://akun.github.io/nikah-demo/"><meta name="description" content="Dengan memohon rahmat Allah SWT, kami mengundang Anda ke pernikahan kami pada 2027-03-14."><!--/META-->
<meta name="theme-color" content="#f3ebe1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@300;400;500;600&family=Amiri&display=swap" rel="stylesheet">
<style>
:root{--cr:#f3ebe1;--cr2:#ebe0d2;--sd:#e2d3c0;--mc:#3e2a21;--mc2:#2b1d17;--tc:#b4623f;--tl:#d9a07f;--mu:#7d675b}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:#d9cfc2;font:400 15px/1.7 Manrope,system-ui,sans-serif;color:var(--mc)}
.app{max-width:480px;margin:auto;background:var(--cr);min-height:100vh;position:relative;overflow-x:clip}
h1,h2,h3,h4{font-family:Fraunces,Georgia,serif;font-weight:400;margin:0;letter-spacing:-.01em}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}.ic.d{fill:currentColor;fill-opacity:.16}
section{padding:76px 24px;position:relative}
.eb{display:flex;align-items:center;gap:10px;font:600 11px Manrope,sans-serif;letter-spacing:3px;text-transform:uppercase;color:var(--tc)}.eb:after{content:"";width:46px;height:1px;background:var(--tc)}
section h2{font-size:clamp(36px,11vw,46px);line-height:1.08;margin:12px 0 22px;font-style:italic}
.dk{background:var(--mc);color:var(--cr)}.dk .eb{color:var(--tl)}.dk .eb:after{background:var(--tl)}.dk h2{color:var(--cr)}
.sub{color:var(--mu);margin:0 0 22px}.dk .sub{color:#cdbbad}
/* reveal */
[data-r]{opacity:0;transition:opacity 1s ease var(--d,0s),transform 1s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
[data-r=up]{transform:translateY(46px)}[data-r=zi]{transform:scale(.9)}[data-r=fl]{transform:translateX(-46px)}[data-r=fr]{transform:translateX(46px)}[data-r].in{opacity:1;transform:none}
.mk{display:block;overflow:hidden;padding-bottom:.08em}.mk>span{display:block;transform:translateY(110%);transition:transform 1.1s cubic-bezier(.2,.8,.2,1) var(--d,0s)}.in .mk>span,.mk.in>span{transform:none}
.bt{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--mc);color:var(--cr);padding:12px 22px;font:600 13px Manrope,sans-serif;border-radius:99px;cursor:pointer;text-decoration:none;margin:4px 6px 4px 0;transition:.3s}
.bt:hover{background:var(--tc)}.bt.o{background:none;color:var(--mc);box-shadow:inset 0 0 0 1.5px var(--mc)}.bt.o:hover{background:var(--mc);color:var(--cr)}.bt.t{background:var(--tc)}.bt.t:hover{background:var(--mc)}
.dk .bt.o{color:var(--cr);box-shadow:inset 0 0 0 1.5px #cdbbad}.dk .bt.o:hover{background:var(--cr);color:var(--mc)}
.dk .ev:not(.r) .bt.o{color:var(--mc);box-shadow:inset 0 0 0 1.5px var(--mc)}.dk .ev:not(.r) .bt.o:hover{background:var(--mc);color:var(--cr)}
.dk .rb{background:var(--tc)}.dk .rb:hover{background:var(--cr);color:var(--mc)}
:is(.bt,input,select,textarea,a,button):focus-visible{outline:2px solid var(--tc);outline-offset:3px}
#pg{position:fixed;top:0;left:0;right:0;height:3px;background:var(--tc);transform:scaleX(0);transform-origin:left;z-index:70}
/* cover amplop */
#cover{position:fixed;inset:0;max-width:480px;margin:auto;z-index:60;background:radial-gradient(circle at 50% 35%,#5a3f31 0,#2b1d17 75%);color:var(--cr);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .9s ease,transform .9s ease;overflow:hidden}
#cover:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,#ffffff06 0 2px,transparent 2px 10px);pointer-events:none}
#cover.off{opacity:0;transform:scale(1.12);pointer-events:none}#cover.gone{display:none}
.cv1{font:600 11px Manrope;letter-spacing:5px;text-transform:uppercase;color:var(--tl);position:relative}
.cvn{font:italic 400 clamp(46px,14vw,60px)/1.05 Fraunces,Georgia,serif;margin:8px 0 34px;position:relative}.cvn i{color:var(--tl)}
.env{position:relative;width:min(300px,78vw);height:min(208px,54vw);background:#e0cdb4;border-radius:6px;box-shadow:0 30px 60px #0008;perspective:1000px}
.letter{position:absolute;left:7%;right:7%;top:9%;bottom:5%;background:#fffaf2;border-radius:4px;padding:8px 8px 6px;display:flex;flex-direction:column;z-index:1;transition:transform 1.1s cubic-bezier(.2,.8,.2,1) .75s;color:var(--mc)}
.letter .lp{flex:1;border-radius:3px;background:var(--sd) center/cover}.letter p{margin:5px 0 0;font:italic 400 14px Fraunces,serif}
.ef{position:absolute;inset:0;background:linear-gradient(135deg,#f0e3d1,#e3d1ba);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);z-index:3;border-radius:6px}
.fp{position:absolute;left:0;right:0;top:0;height:58%;background:#d3bd9f;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s cubic-bezier(.5,0,.2,1),z-index 0s .4s;z-index:4}
.seal{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#d9855f,#b4623f 60%,#8e4a2d);color:#fff;z-index:5;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 14px #0006,inset 0 0 0 3px #ffffff22;animation:pu 2s ease-in-out infinite;transition:opacity .4s,transform .4s}
@keyframes pu{50%{transform:scale(1.1);box-shadow:0 6px 24px #b4623faa,inset 0 0 0 3px #ffffff22}}
.seal .ic{width:24px;height:24px;fill:currentColor;stroke:none}
#cover.go .fp{transform:rotateX(180deg);z-index:0}#cover.go .seal{opacity:0;transform:scale(.4);animation:none;pointer-events:none}#cover.go .letter{transform:translateY(-58%) scale(1.06);z-index:2}
.gst{margin-top:34px;position:relative}.gst small{color:#cdbbad;font-size:12px;letter-spacing:1px}.gst b{display:block;font:italic 400 25px/1.25 Fraunces,serif;overflow-wrap:anywhere}.gst p{font-size:12px;color:var(--tl);margin:8px 0 0;letter-spacing:1px}
#cover.go .gst,#cover.go .cv1,#cover.go .cvn{opacity:0;transition:opacity .5s}
/* hero */
.hero{padding:0}
.mq{overflow:hidden;white-space:nowrap;background:var(--mc);color:var(--cr);padding:9px 0;font:600 11px Manrope;letter-spacing:4px;text-transform:uppercase}
.mq div{display:inline-block;animation:mq 22s linear infinite}.mq span{margin:0 14px}.mq i{color:var(--tl);font-style:normal}
@keyframes mq{to{transform:translateX(-50%)}}
.hp{position:relative;margin:16px 16px 0;height:max(430px,64vh);border-radius:32px;overflow:hidden;background:var(--sd)}
.hp .bg{position:absolute;inset:-6% 0;background:center 35%/cover;transform:translateY(var(--py,0px)) scale(1.06)}
.hp .ov{position:absolute;inset:0;background:linear-gradient(180deg,#2b1d1766 0,#0000 28%,#0000 45%,#2b1d17e6 100%)}
.hp .tg{position:absolute;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;color:#fff;font:600 10px Manrope;letter-spacing:3px;text-transform:uppercase}
.hp .nm{position:absolute;left:22px;right:22px;bottom:20px;color:#fff}
.hn{font:italic 400 clamp(54px,17vw,76px)/.95 Fraunces,Georgia,serif;letter-spacing:-.03em}.hn em{color:var(--tl);font-style:italic}
.hi{padding:20px 24px 110px}.hi .bs{font:28px/1.6 Amiri,serif;margin:0 0 4px;color:var(--tc)}
.dt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}.dt b{font:italic 400 24px Fraunces,serif}.dt span{padding:5px 12px;border-radius:99px;background:var(--sd);font-size:12px;font-weight:500}
.gs{font-size:13px;color:var(--mu)}.gs b{display:block;font:italic 400 21px Fraunces,serif;color:var(--mc);overflow-wrap:anywhere}
/* ayat */
#kutipan{background:var(--mc);color:var(--cr);text-align:left;overflow:hidden}
#kutipan:before{content:"\201C";position:absolute;top:-20px;left:10px;font:italic 400 220px/1 Fraunces,serif;color:#ffffff10}
.ar{font:26px/2.1 Amiri,serif;direction:rtl;text-align:right;color:var(--tl);margin:0 0 10px;position:relative}.qt{font:italic 400 18px/1.7 Fraunces,serif;margin:0 0 12px;position:relative}.src{color:var(--tl);font:600 11px Manrope;letter-spacing:3px;text-transform:uppercase}
/* mempelai */
.pc{position:relative;border-radius:30px;overflow:hidden;aspect-ratio:4/5;background:var(--sd) center/cover;color:#fff}
.pc:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 45%,#2b1d17ee 100%)}
.pc .in2{position:absolute;left:22px;right:22px;bottom:20px;z-index:1}.pc h3{font:italic 400 34px/1.1 Fraunces,serif}.pc p{margin:6px 0 0;font-size:13px;color:#eadfd3}.pc p b{color:#fff;font-weight:600}
.bdg{width:64px;height:64px;border-radius:50%;background:var(--tc);color:#fff;display:grid;place-items:center;font:italic 400 32px Fraunces,serif;margin:-32px auto;position:relative;z-index:2;box-shadow:0 0 0 6px var(--cr)}
.pc+.bdg+.pc{margin-top:0}
/* acara */
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 18px}.cd div{background:#ffffff12;border-radius:20px;padding:14px 0 10px;text-align:center}.cd b{display:block;font:italic 400 32px/1 Fraunces,serif;color:#fff}.cd small{font:600 9px Manrope;letter-spacing:2px;text-transform:uppercase;color:var(--tl)}
.ev{border-radius:28px;padding:22px;margin:14px 0;background:var(--cr);color:var(--mc);text-align:left;display:grid;grid-template-columns:auto 1fr;gap:4px 18px}
.ev.r{background:var(--tc);color:#fff}.ev.r .bt{background:#fff;color:var(--tc)}.ev.r .bt.o{background:none;color:#fff;box-shadow:inset 0 0 0 1.5px #fff}
.ev .dd{grid-row:span 3;text-align:center;border-right:1px solid #0002;padding-right:18px}.ev.r .dd{border-color:#fff4}.ev .dd b{display:block;font:italic 400 58px/1 Fraunces,serif}.ev .dd small{font:600 10px Manrope;letter-spacing:2px;text-transform:uppercase}
.ev h3{font:italic 400 26px Fraunces,serif}.ev p{margin:0;font-size:14px}.ev .bw{grid-column:1/-1;margin-top:10px}
/* kisah sticky */
.sk{position:sticky;border-radius:28px;padding:24px;margin-bottom:18px;text-align:left;box-shadow:0 -10px 30px #0001}
.sk .y{font:italic 400 52px/1 Fraunces,serif;opacity:.85}.sk h4{font:600 18px Manrope;margin:8px 0 4px}.sk p{margin:0;font-size:14px;opacity:.85}
.sk:nth-child(1){background:var(--sd)}.sk:nth-child(2){background:var(--tl)}.sk:nth-child(3){background:var(--tc);color:#fff}.sk:nth-child(4){background:var(--mc);color:var(--cr)}.sk:nth-child(n+5){background:var(--cr2)}
/* galeri stack */
#stk{position:relative;height:410px;margin:10px auto 8px;width:250px;touch-action:pan-y}
.pol{position:absolute;inset:0 0 auto 0;height:370px;background:#fffdf8;padding:10px 10px 0;border-radius:6px;box-shadow:0 14px 34px #3e2a2140;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y;will-change:transform}
.pol img{width:100%;height:312px;object-fit:cover;border-radius:2px;pointer-events:none;background:var(--sd)}.pol span{display:block;text-align:center;font:italic 400 14px/46px Fraunces,serif;color:var(--mu)}
.pol:after{content:"";position:absolute;top:-10px;left:50%;width:70px;height:22px;margin-left:-35px;background:#d9a07f99;transform:rotate(-3deg)}
.gc2{display:flex;justify-content:center;gap:12px;margin-top:6px}.rb{width:46px;height:46px;border-radius:50%;border:0;background:var(--mc);color:#fff;display:grid;place-items:center;cursor:pointer}.rb:hover{background:var(--tc)}
#lb{position:fixed;inset:0;background:#1d130fee;z-index:80;display:none;align-items:center;justify-content:center}#lb img{max-width:92%;max-height:88%;border-radius:8px}
/* hadiah */
.gf{border-radius:26px;padding:22px;margin:14px 0;background:linear-gradient(135deg,var(--tc),#8e4a2d);color:#fff;text-align:left;position:relative;overflow:hidden}
.gf:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:#ffffff14}
.gf.b{background:linear-gradient(135deg,var(--mc),#5a3f31)}.gf small{font:600 10px Manrope;letter-spacing:3px;text-transform:uppercase;opacity:.85}.gf .no{display:block;font:italic 400 28px/1.3 Fraunces,serif;letter-spacing:1px;margin:8px 0 2px;overflow-wrap:anywhere}.gf .an{font-size:13px;opacity:.9}
.gf .bt{background:#fff;color:var(--mc);margin:14px 0 0;position:relative;z-index:1}
/* rsvp */
form.cd2{background:#fff;border-radius:28px;padding:22px;margin:14px 0;box-shadow:0 10px 30px #3e2a2112;text-align:left}form h4{font:italic 400 26px Fraunces,serif;margin-bottom:4px}
label.l{display:block;font:600 11px Manrope;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin:16px 0 6px}
input[type=text],textarea{width:100%;padding:13px 16px;border:1.5px solid var(--sd);border-radius:16px;font:inherit;background:var(--cr);color:var(--mc)}textarea{resize:vertical;border-radius:18px}
.pills{display:flex;gap:8px;flex-wrap:wrap}.pills label{cursor:pointer}.pills input{position:absolute;opacity:0;pointer-events:none}.pills span{display:block;padding:9px 16px;border-radius:99px;background:var(--cr);box-shadow:inset 0 0 0 1.5px var(--sd);font-size:13px;font-weight:500;transition:.25s}.pills input:checked+span{background:var(--tc);color:#fff;box-shadow:none}.pills input:focus-visible+span{outline:2px solid var(--tc);outline-offset:2px}
.st{font-size:13px;margin-top:10px;min-height:20px;color:var(--tc)}
#msgs{max-height:380px;overflow:auto;margin-top:18px;padding-right:4px;text-align:left}
#msgs .m{display:flex;gap:10px;margin:12px 0}#msgs .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:italic 400 18px Fraunces,serif;color:#fff;flex:none}
#msgs .bb{background:#fff;border-radius:4px 20px 20px 20px;padding:10px 14px;font-size:14px;box-shadow:0 4px 14px #3e2a2110}#msgs b{font-weight:600}#msgs small{color:var(--mu)}
ol.kl{text-align:left;padding-left:22px;font-size:15px}ol.kl li{margin:2px 0}ol.kl li::marker{color:var(--tl);font-family:Fraunces}
/* penutup */
.pen{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:60px 24px 120px;overflow:hidden;background:var(--mc);color:#fff;text-align:left}
.pen .pb{position:absolute;inset:0;background:center 30%/cover}.pen .po{position:absolute;inset:0;background:linear-gradient(180deg,#2b1d1788 0,#0000 30%,#2b1d17cc 65%,#2b1d17 100%)}.pen .pc2{position:relative;z-index:1}
.pen .hn{font-size:clamp(58px,19vw,84px)}.pen p{max-width:34ch;color:#eadfd3}
/* dock */
#dock{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:2px;background:#fffc;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:99px;padding:6px;z-index:40;box-shadow:0 12px 34px #3e2a2140;max-width:94vw}
#dock a{display:flex;align-items:center;gap:6px;padding:11px;border-radius:99px;color:var(--mc);text-decoration:none;font:600 12px Manrope;transition:.4s}#dock a span{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:.4s}
#dock a.on{background:var(--tc);color:#fff;padding:11px 14px}#dock a.on span{max-width:64px;opacity:1}
#mus{position:fixed;top:14px;right:max(14px,calc(50% - 226px));z-index:41;width:42px;height:42px;border-radius:50%;border:0;background:#fffc;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer;display:flex;gap:3px;align-items:center;justify-content:center;box-shadow:0 4px 16px #0003}
#mus i{width:3px;height:8px;border-radius:2px;background:var(--tc);transform-origin:center}#mus.play i{animation:eq .9s ease-in-out infinite}#mus.play i:nth-child(2){animation-delay:-.3s}#mus.play i:nth-child(3){animation-delay:-.6s}#mus.play i:nth-child(4){animation-delay:-.15s}
@keyframes eq{50%{transform:scaleY(2.3)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto}[data-r]{opacity:1;transform:none}.mk>span{transform:none}}
/* tema kartu rekening per bank (adaptif v2) */
/* hanya warna, motif & logo: ukuran kartu tidak berubah (logo menempel di pojok kanan bawah) */
.gf[data-bk]{color:var(--bt);background:var(--pt),linear-gradient(140deg,var(--b1),var(--b2));border-color:var(--ba);position:relative}
.gf[data-bk] b,.gf[data-bk] small,.gf[data-bk] span,.gf[data-bk] div,.gf[data-bk] p{color:var(--bt)}
.gf[data-bk] button{color:var(--bt);border-color:var(--ba);background:rgba(255,255,255,.16)}
.gf .lgc{position:absolute;bottom:.9em;right:.9em;z-index:2;display:flex;align-items:center;box-sizing:border-box;height:28px;padding:0 9px;background:#fff;border-radius:6px;font-size:15px;line-height:1}
.gf .lgc .lg{display:block;height:15px;width:auto;max-width:90px}

[data-bk=bsi]{--b1:#00A39D;--b2:#006f6b;--bt:#fff;--ba:#f8ad3c;--pt:url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2240%22%20height=%2240%22%3E%3Cpath%20d=%22M20%203%2025%2015%2037%2020%2025%2025%2020%2037%2015%2025%203%2020%2015%2015Z%22%20fill=%22none%22%20stroke=%22%23fff%22%20stroke-opacity=%220.14%22%20stroke-width=%221.4%22/%3E%3C/svg%3E")}

<form id="f2" class="cd2" ${R('up')}><h4>Ucapan & Doa Restu</h4><label class="l" for="n2">Nama</label><input type="text" id="n2" maxlength="40" required value="${e(Q)}"><label class="l">Kehadiran</label>${pl('hd2',HD)}<label class="l" for="p2">Ucapan <span id="ct">(0/300)</span></label><textarea id="p2" maxlength="300" rows="4" required></textarea><div style="margin-top:20px"><button class="bt t">${ic('send')}Kirim Ucapan</button></div><div class="st" id="st2" role="status"></div></form><div id="msgs"></div>`);
if(kl.length)h+=sec('turut-mengundang','Segenap Keluarga','Turut<br>Mengundang',`<p class="sub" ${R('up')}>Ungkapan rasa hormat dan terima kasih yang tulus kepada segenap keluarga besar, alim ulama, tokoh masyarakat, dan handai taulan:</p><ol class="kl" ${R('up',.1)}>${kl.map((k,i)=>`<li${i>=8?' hidden data-x':''}>${e(k)}</li>`).join('')}</ol>${kl.length>8?'<button class="bt o" id="more">Lihat Selengkapnya</button>':''}`,'dk');
const PN=D.foto.penutup||'';
h+=`<section id="penutup" data-t="Penutup" class="pen">${PN?`<div class="pb" style="background-image:${url(PN)}" role="img" aria-label="Foto penutup"></div><div class="po"></div>`:''}<div class="pc2"><div class="eb" style="color:var(--tl)" ${R('up')}>Terima Kasih</div><h2 class="hn" style="margin:12px 0 14px"><span class="mk" ${R('up')}><span>${e(A1.panggilan)}</span></span><span class="mk" ${R('up',.15)}><span>&amp; <em>${e(A2.panggilan)}</em></span></span></h2><p ${R('up',.2)}>Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir untuk memberikan doa restu kepada kedua mempelai.</p><p ${R('up',.3)}>Wassalamu'alaikum Wr. Wb.</p>${D.demo?'<small style="color:#cdbbad">Data contoh (DEMO)</small>':''}</div></section>`;
$('#app').innerHTML=h+'<nav id="dock" aria-label="Menu"></nav>';
const IC={home:['home','Home'],mempelai:['heart','Couple'],acara:['cal','Acara'],galeri:['img','Foto'],hadiah:['gift','Kado'],ucapan:['msg','RSVP']};
$('#dock').innerHTML=$$('section').filter(s=>IC[s.id]).map(s=>`<a href="#${s.id}" data-s="${s.id}" aria-label="${IC[s.id][1]}">${ic(IC[s.id][0],'d')}<span>${IC[s.id][1]}</span></a>`).join('');
$('#cn').innerHTML=`${e(A1.panggilan)} <i>&amp;</i> ${e(A2.panggilan)}`;$('#cl').textContent=tgl(D.akad);$('#tm').textContent=tamu;$('#cvph').style.backgroundImage=url(D.foto.cover);document.body.style.overflow='hidden';
// buka amplop
const au=$('#au');if(D.musik){au.src=D.musik;$('#mus').hidden=false}
$('#open').onclick=()=>{const c=$('#cover');c.classList.add('go');document.body.style.overflow='';if(D.musik)au.play().catch(()=>{});setTimeout(()=>c.classList.add('off'),2700);setTimeout(()=>c.classList.add('gone'),3700)};
$('#mus').onclick=()=>au.paused?au.play():au.pause();au.onplay=()=>$('#mus').classList.add('play');au.onpause=()=>$('#mus').classList.remove('play');
// reveal, dock aktif, progress, parallax
const ob=new IntersectionObserver(a=>a.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');ob.unobserve(x.target)}}),{threshold:.12});$$('[data-r],.mk').forEach(s=>ob.observe(s));
const nv=new IntersectionObserver(a=>a.forEach(x=>{if(x.isIntersecting){const id=x.target.id==='kutipan'?'home':x.target.id;$$('#dock a').forEach(l=>l.classList.toggle('on',l.dataset.s===id))}}),{rootMargin:'-45% 0px -50% 0px'});$$('section').forEach(s=>nv.observe(s));
let tk2=0;addEventListener('scroll',()=>{if(tk2)return;tk2=requestAnimationFrame(()=>{tk2=0;const m=document.documentElement.scrollHeight-innerHeight;$('#pg').style.transform=`scaleX(${m>0?scrollY/m:0})`;$('#hbg').style.setProperty('--py',Math.min(scrollY,700)*.18+'px')})},{passive:true});
// countdown
const T=when(D.akad);setInterval(function t(){let s=Math.max(0,(T-Date.now())/1000|0);$('#cd').innerHTML=[['Hari',86400],['Jam',3600],['Menit',60],['Detik',1]].map(([l,m])=>{const v=s/m|0;s-=v*m;return `<div><b>${String(v).padStart(2,'0')}</b><small>${l}</small></div>`}).join('');return t}(),1000);
$$('[data-cp]').forEach(b=>{const o=b.innerHTML;b.onclick=()=>navigator.clipboard.writeText(b.dataset.cp).then(()=>{b.innerHTML=ic('copy')+'Tersalin';setTimeout(()=>b.innerHTML=o,1800)},()=>b.textContent='Salin manual')});
$('#lb').onclick=()=>$('#lb').style.display='none';
if($('#more'))$('#more').onclick=function(){$$('[data-x]').forEach(l=>l.hidden=false);this.remove()};
// galeri: tumpukan kartu geser
const stk=$('#stk');if(stk){const cs=[...stk.children],ord=cs.map((_,i)=>i);let drag=null,timer;
const lay=()=>ord.forEach((ci,p)=>{const c=cs[ci];if(c===drag)return;const n=Math.min(p,3),sg=p%2?1:-1;c.style.transition='transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s';c.style.transform=`translate(0,${n*11}px) rotate(${p?sg*(2+p*1.4):0}deg) scale(${1-n*.045})`;c.style.zIndex=100-p;c.style.opacity=p>3?0:1;c.style.pointerEvents=p?'none':'auto'});
const fly=d=>{const c=cs[ord[0]];c.style.transition='transform .45s ease-in,opacity .45s';c.style.transform=`translate(${d*480}px,-30px) rotate(${d*26}deg)`;c.style.opacity=0;setTimeout(()=>{ord.push(ord.shift());lay()},300)};
const play=()=>{clearInterval(timer);timer=setInterval(()=>fly(1),4200)};
cs.forEach(c=>{let sx,sy,dx=0,dy=0;c.onpointerdown=v=>{if(c!==cs[ord[0]])return;drag=c;sx=v.clientX;sy=v.clientY;dx=dy=0;c.setPointerCapture(v.pointerId);c.style.transition='none';clearInterval(timer)};
c.onpointermove=v=>{if(drag!==c)return;dx=v.clientX-sx;dy=v.clientY-sy;c.style.transform=`translate(${dx}px,${dy*.3}px) rotate(${dx/16}deg)`};
const up=()=>{if(drag!==c)return;drag=null;if(Math.abs(dx)>80)fly(dx>0?1:-1);else{lay();if(Math.abs(dx)<6&&Math.abs(dy)<6){$('#lb img').src=c.querySelector('img').src;$('#lb').style.display='flex'}}play()};c.onpointerup=up;c.onpointercancel=up});
$('#pv').onclick=()=>{fly(-1);play()};$('#nx').onclick=()=>{fly(1);play()};lay();play()}
// RSVP & ucapan
$('#p2').oninput=()=>$('#ct').textContent=`(${$('#p2').value.length}/300)`;
$$('input[name=hd1]').forEach(r=>r.onchange=()=>$('#jw').style.display=$('input[name=hd1]:checked').value=='hadir'?'':'none');
let show=D.tampil.ucapan;const CL=['#b4623f','#8e4a2d','#7d675b','#a07855','#5a3f31'];
async function muat(){const m=$('#msgs');if(!FB.ok())return;try{const c=await FB.pengaturan();if(!URUT_URL&&(c.urutNama==='pria'||c.urutNama==='wanita')&&((c.urutNama==='wanita')!==WF)){try{const uu=new URL(location.href);uu.searchParams.set('urut',c.urutNama);location.replace(uu.toString());return}catch(x){}}if(c.ucapan!==undefined)show=c.ucapan;if(!show)return;m.innerHTML=(await FB.ucapan()).filter(u=>u.pesan).map(u=>{const n=(u.nama||'?').trim();return `<div class="m"><span class="av" style="background:${CL[n.length%5]}">${e(n.charAt(0).toUpperCase())}</span><div class="bb"><b>${e(n)}</b> <small>· ${u.hadir=='hadir'?'Hadir':u.hadir=='tidak'?'Tidak hadir':'Ragu-ragu'}</small><br>${e(u.pesan)}</div></div>`}).join('')}catch(x){m.textContent='Ucapan belum dapat dimuat.'}}muat();
async function kirim(ev,id){ev.preventDefault();const st=$('#st'+id);if(!FB.ok()){st.textContent='Firebase belum dikonfigurasi.';return}st.textContent='Mengirim…';
const hd=$(`input[name=hd${id}]:checked`).value;try{await FB.kirim({nama:$('#n'+id).value.trim().slice(0,40),hadir:hd,jumlah:id==1&&hd=='hadir'?+$('input[name=jm1]:checked').value:0,pesan:id==2?$('#p2').value.trim().slice(0,300):''});st.textContent=id==1?'Konfirmasi terkirim ✓':'Terima kasih, ucapan terkirim ✓';if(id==2){$('#p2').value='';muat()}}catch(x){st.textContent='Gagal mengirim: '+x.message}}
$('#f1').onsubmit=v=>kirim(v,1);$('#f2').onsubmit=v=>kirim(v,2);
</script></body></html>
